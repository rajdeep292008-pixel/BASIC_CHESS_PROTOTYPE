<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vantage Chess Pro | Fixed Build</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root { --bg: #161512; --gold: #c3a65a; }
        body { background: var(--bg); color: white; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.5rem; }
        #myBoard { width: 450px; border: 4px solid #2a2926; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .active-timer { background: white !important; color: black !important; box-shadow: 0 0 20px var(--gold); border: 2px solid var(--gold); }
        .btn-choice { transition: all 0.2s ease; cursor: pointer; border: 2px solid transparent; }
        .btn-choice:hover { transform: translateY(-5px); border-color: var(--gold); }
        
        #move-history-container::-webkit-scrollbar { width: 6px; }
        #move-history-container::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="setup-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#161512]">
        <div class="glass p-10 text-center shadow-2xl">
            <h1 class="text-2xl font-bold text-[--gold] mb-8 uppercase tracking-widest italic">Vantage Chess</h1>
            <div class="flex gap-8 justify-center">
                <div onclick="initGame('w')" class="btn-choice bg-zinc-800 p-6 rounded-2xl w-32">
                    <img src="https://chessboardjs.com/img/chesspieces/wikipedia/wK.png" class="w-full mb-2">
                    <span class="font-bold text-xs">PLAY WHITE</span>
                </div>
                <div onclick="initGame('b')" class="btn-choice bg-zinc-800 p-6 rounded-2xl w-32">
                    <img src="https://chessboardjs.com/img/chesspieces/wikipedia/bK.png" class="w-full mb-2">
                    <span class="font-bold text-xs">PLAY BLACK</span>
                </div>
            </div>
            <p id="loader-msg" class="mt-6 text-gray-500 text-xs italic">Select your side to begin the match</p>
        </div>
    </div>

    <div class="mb-4 flex items-center gap-10">
        <div class="flex flex-col items-center">
            <span class="text-[10px] text-gray-500 mb-1 font-bold">OPPONENT</span>
            <div id="clock-opp" class="bg-zinc-900 px-6 py-2 rounded-lg font-mono text-3xl transition-all duration-300">10:00</div>
        </div>
        <div class="text-center">
            <h2 class="text-[--gold] font-black uppercase text-sm tracking-tighter">VANTAGE</h2>
            <div id="game-info" class="text-[10px] text-gray-400 uppercase font-bold tracking-widest">In Battle</div>
        </div>
        <div class="flex flex-col items-center">
            <span class="text-[10px] text-gray-500 mb-1 font-bold">YOU</span>
            <div id="clock-user" class="bg-zinc-900 px-6 py-2 rounded-lg font-mono text-3xl transition-all duration-300">10:00</div>
        </div>
    </div>

    <div class="flex flex-col lg:flex-row gap-8 items-start">
        <div id="myBoard"></div>

        <div class="glass w-[280px] h-[450px] flex flex-col overflow-hidden border border-zinc-700 shadow-2xl">
            <div class="bg-zinc-800 p-4 border-b border-zinc-700 text-xs font-bold tracking-widest text-[--gold] uppercase flex justify-between">
                <span>Move History</span>
                <i class="fa-solid fa-scroll"></i>
            </div>
            <div id="move-history-container" class="flex-grow overflow-y-auto p-4 font-mono text-sm bg-[#1e1e1e]">
                <div id="move-list" class="grid grid-cols-3 gap-y-2 gap-x-1">
                    </div>
            </div>
            <div class="p-3 bg-zinc-800 flex gap-2">
                <button onclick="window.location.reload()" class="w-full bg-red-900/20 hover:bg-red-900/40 text-red-400 text-[10px] font-bold py-2 rounded uppercase transition border border-red-900/30">Resign</button>
            </div>
        </div>
    </div>

    <script>
        let board = null;
        let game = new Chess();
        let mySide = 'w';
        let clocks = { w: 600, b: 600 };
        let timerInterval = null;

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return `${m}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function runClock() {
            if (game.game_over()) {
                clearInterval(timerInterval);
                return;
            }
            
            const turn = game.turn(); // 'w' or 'b'
            clocks[turn]--;

            // Map clocks to UI correctly based on user side
            const userID = '#clock-user';
            const oppID = '#clock-opp';

            if (mySide === 'w') {
                $(userID).text(formatTime(clocks.w)).toggleClass('active-timer', turn === 'w');
                $(oppID).text(formatTime(clocks.b)).toggleClass('active-timer', turn === 'b');
            } else {
                $(userID).text(formatTime(clocks.b)).toggleClass('active-timer', turn === 'b');
                $(oppID).text(formatTime(clocks.w)).toggleClass('active-timer', turn === 'w');
            }

            if (clocks[turn] <= 0) {
                clearInterval(timerInterval);
                alert("Game Over: Time Forfeit!");
            }
        }

        function renderHistory() {
            const history = game.history();
            const $list = $('#move-list');
            $list.empty();
            for (let i = 0; i < history.length; i += 2) {
                $list.append(`
                    <div class="text-zinc-600">${Math.floor(i/2) + 1}.</div>
                    <div class="text-white font-bold">${history[i]}</div>
                    <div class="text-zinc-400">${history[i+1] || '--'}</div>
                `);
            }
            const container = document.getElementById('move-history-container');
            container.scrollTop = container.scrollHeight;
        }

        function initGame(side) {
            mySide = side;
            $('#setup-screen').fadeOut(300);

            const config = {
                draggable: true,
                position: 'start',
                orientation: side === 'w' ? 'white' : 'black',
                onDragStart: (source, piece) => {
                    if (game.game_over()) return false;
                    if (piece.charAt(0) !== game.turn().charAt(0)) return false; // Prevent moving wrong color
                    if (game.turn() !== mySide) return false; // Prevent moving on AI turn
                },
                onDrop: (source, target) => {
                    let move = game.move({ from: source, to: target, promotion: 'q' });
                    if (move === null) return 'snapback';
                    
                    if (!timerInterval) timerInterval = setInterval(runClock, 1000);
                    updateUI();
                    setTimeout(makeAiMove, 500);
                },
                onSnapEnd: () => board.position(game.fen()),
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };

            board = Chessboard('myBoard', config);
            
            if (side === 'b') {
                if (!timerInterval) timerInterval = setInterval(runClock, 1000);
                setTimeout(makeAiMove, 800);
            }
            updateUI();
        }

        function makeAiMove() {
            const moves = game.moves();
            if (moves.length === 0) return;
            game.move(moves[Math.floor(Math.random() * moves.length)]);
            board.position(game.fen());
            updateUI();
        }

        function updateUI() {
            renderHistory();
            let msg = game.turn() === mySide ? "YOUR TURN" : "AI THINKING...";
            if (game.in_checkmate()) msg = "CHECKMATE!";
            if (game.in_draw()) msg = "DRAW!";
            $('#game-info').text(msg);
        }
    </script>
</body>
</html>
